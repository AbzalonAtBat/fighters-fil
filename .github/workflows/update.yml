name: Mise a jour du fil Fighters

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Le deploiement passe par l'artefact Pages, pas par un commit : plus aucune
# ecriture dans le depot, donc plus de collision avec les executions planifiees.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Le cache de traduction doit survivre entre les executions : sans lui,
      # chaque passage retraduirait les memes titres et epuiserait le quota
      # gratuit de MyMemory. Le workflow ne commite plus (le deploiement passe
      # par l'artefact), donc le cache passe par actions/cache.
      - uses: actions/cache@v4
        with:
          path: data/translate_cache.json
          key: trcache-${{ github.run_id }}
          restore-keys: trcache-

      - name: Collecte et rendu
        run: |
          python3 collect.py
          python3 render.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
